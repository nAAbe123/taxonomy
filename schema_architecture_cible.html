<text x="310.0" y="1164.0" text-anchor="middle" fill="#5b6775" font-size="11">qu'est-ce qui bouge en même temps ? Rapproche métriques, events et logs</text>
<text x="310.0" y="1178.0" text-anchor="middle" fill="#5b6775" font-size="11">sur des clés communes</text>

<text class="lb" x="90" y="1222" text-anchor="start" fill="#14202e" font-size="11" >Corrélation : clés communes (service, hôte, environnement, client), topologie du référentiel de production, contexte CMDB.</text>
<text class="lb" x="90" y="1238" text-anchor="start" fill="#14202e" font-size="11" >Causalité : mêmes events, plus les changements publiés sur Kafka in. Les résultats reviennent sur Kafka in comme events dérivés.</text>

<text x="785.0" y="1376.5" text-anchor="middle" font-weight="600" fill="#14202e" font-size="20">Observabilité unifiée</text>
<text x="0" y="1436" font-size="12" fill="#5b6775">Les spans et métriques OTel alimentent Dynatrace sans passer par Kafka, via le OneAgent (à confirmer). Les traces ne vont que vers Dynatrace.</text>
<text x="0" y="1454" font-size="12" fill="#5b6775">Normalisation : standard OTel, sinon ECS, au plus tôt, avec une dernière barrière à l'entrée du Lakehouse.</text>
<text x="0" y="1472" font-size="12" fill="#5b6775">Le control plane définit et distribue les configurations. Backends exposés : Dynatrace Managed et Grafana Enterprise ; Elastic ELK pourrait y être rattaché (à valider).</text>
<text x="0" y="1490" font-size="12" fill="#5b6775">Tous les logs vont exclusivement vers Elastic ELK, par le pipeline logs OTel (Fluent Bit ou Collector, Gateway, Kafka OTLP).</text>
<text x="0" y="1508" font-size="12" fill="#5b6775">Temps réel : tous les backends poussent leurs events vers l'AIOps. Temps long : le reste des backends, ainsi que l'AIOps, alimente l'export et l'ingestion normalisée, puis le Lakehouse. L'AIOps et le Lakehouse échangent uniquement par</text>
<text x="0" y="1526" font-size="12" fill="#5b6775">Kafka (voir Events et incidents).</text>
