<script>
const NAME="events_incidents";
function svgData(){const s=document.getElementById('schema');const c=s.cloneNode(true);c.setAttribute('xmlns','http://www.w3.org/2000/svg');const vb=s.viewBox.baseVal;c.setAttribute('width',vb.width);c.setAttribute('height',vb.height);return new XMLSerializer().serializeToString(c)}
function save(u,n){const a=document.createElement('a');a.href=u;a.download=n;a.click()}
function dlSvg(){save(URL.createObjectURL(new Blob([svgData()],{type:'image/svg+xml'})),NAME+'.svg')}
function dlPng(){const s=svgData();const vb=document.getElementById('schema').viewBox.baseVal;const img=new Image();
img.onload=()=>{const k=2;const c=document.createElement('canvas');c.width=vb.width*k;c.height=vb.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>save(URL.createObjectURL(b),NAME+'.png'))};
img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
</script></body></html>
